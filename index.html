<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Olatoye Dolapo Salim — Computer Vision for Marine Ecology</title>
<meta name="description" content="PhD Candidate, University of Pisa. AI and Computer Vision for marine biodiversity monitoring."/>
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"/>
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<meta name="theme-color" content="#f4f7fa" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0a121c" media="(prefers-color-scheme: dark)"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script>
  // home page: fetch the sea video's poster first so it paints immediately
  if (location.pathname === '/') {
    var pre = document.createElement('link');
    pre.rel = 'preload'; pre.as = 'image'; pre.href = '/assets/video/posters/sea.jpg';
    pre.setAttribute('fetchpriority', 'high');
    document.head.appendChild(pre);
  }
</script>
<script>
  try {
    var saved = localStorage.getItem('ods-theme-v2') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
<!-- Netlify Identity: redirects invite/recovery emails into the /admin CMS login -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', (user) => {
      if (!user) {
        window.netlifyIdentity.on('login', () => {
          document.location.href = '/admin/';
        });
      }
    });
  }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
