<head>
<meta charset="UTF-8"/>

<meta name="description" content="PhD Candidate, University of Pisa. AI and Computer Vision for marine biodiversity monitoring."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400..700&family=Source+Serif+4:opsz,wght@8..60,400..700&family=Source+Sans+3:wght@400..700&family=Source+Code+Pro:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet"/>
<script>
  try {
    var saved = localStorage.getItem('ods-theme-v2') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    var font = localStorage.getItem('ods-font');
    if (font) document.documentElement.setAttribute('data-font', font);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
<!-- Netlify Identity: redirects invite/recovery emails into the /admin CMS login -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', (user) => {
      if (!user) {
        window.netlifyIdentity.on('login', () => {
          document.location.href = '/admin/';
        });
      }
    });
  }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
