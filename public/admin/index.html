<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Olatoye Dolapo Salim</title>
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <style>
    .notes-link { position: fixed; right: 16px; bottom: 16px; z-index: 9999; padding: 9px 15px; border-radius: 999px;
      background: #0f1c2b; color: #fff; font: 500 14px/1 system-ui, sans-serif; text-decoration: none; box-shadow: 0 4px 14px rgba(0,0,0,.2) }
    .notes-link:hover { background: #1d5fb8 }
  </style>
</head>
<body>
  <a class="notes-link" href="/admin/notes.html">Love notes →</a>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
