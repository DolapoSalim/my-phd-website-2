<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Love notes · admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root { --bg: #f4f7fa; --surface: #fff; --text: #0f1c2b; --muted: #5c6d80; --border: #dde5ee; --accent: #1d5fb8; --danger: #c2272d }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); background: var(--surface) }
    h1 { margin: 0; font-size: 20px }
    .muted { color: var(--muted) }
    button, a.btn { font: inherit; border: 0; border-radius: 999px; padding: 8px 15px; cursor: pointer; background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
    button.primary { background: var(--text); color: #fff; box-shadow: none }
    button.danger { color: var(--danger) }
    button:disabled { opacity: .5; cursor: default }
    main { padding: 24px; max-width: 1200px; margin: 0 auto }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px }
    .card { background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--border); overflow: hidden }
    .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee }
    .card .meta { padding: 10px 12px; font-size: 13px }
    .card .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px }
    .card .actions > * { padding: 5px 11px; font-size: 13px }
    #msg { margin: 0 0 16px }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Love notes</h1>
      <div class="muted">Notes visitors pinned on the “My love life” wall.</div>
    </div>
    <div class="bar" style="margin:0">
      <a class="btn" href="/notes" target="_blank" rel="noreferrer">Open the wall ↗</a>
      <a class="btn" href="/admin/">Back to the CMS</a>
      <button id="auth">Log in</button>
    </div>
  </header>
  <main>
    <p id="msg" class="muted">Log in with your site account (the same one as the CMS) to see the notes.</p>
    <div class="bar" id="tools" hidden>
      <button class="primary" id="zip">Download all as ZIP (PNG)</button>
      <span class="muted" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const id = window.netlifyIdentity
    const $ = (s) => document.querySelector(s)
    let notes = []

    const stamp = (t) => new Date(t).toISOString().replace(/[:T]/g, '-').slice(0, 19)
    const fileName = (n, ext) => `love-note-${stamp(n.createdAt)}-${n.id.slice(-6)}.${ext}`

    async function token() {
      const user = id && id.currentUser()
      return user ? user.jwt() : null
    }
    async function api(path, opts = {}) {
      const t = await token()
      if (!t) throw new Error('Please log in.')
      const res = await fetch('/api/notes-admin' + path, { ...opts, headers: { authorization: 'Bearer ' + t } })
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Request failed (' + res.status + ')')
      return res.json()
    }

    function saveBlob(blob, name) {
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = name
      document.body.appendChild(a)
      a.click()
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 1000)
    }
    async function pngBlob(n) { return (await fetch(n.src)).blob() }
    async function jpgBlob(n) {
      const img = new Image()
      img.src = URL.createObjectURL(await pngBlob(n))
      await img.decode()
      const c = document.createElement('canvas')
      c.width = img.naturalWidth; c.height = img.naturalHeight
      const ctx = c.getContext('2d')
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0)
      return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.92))
    }

    // Minimal ZIP writer (stored, no compression — PNGs are already compressed).
    const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0 } return t })()
    const crc32 = (b) => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0 }
    function zip(files) {
      const enc = new TextEncoder(), parts = [], central = []
      let offset = 0
      for (const f of files) {
        const name = enc.encode(f.name), data = f.data, crc = crc32(data)
        const local = new DataView(new ArrayBuffer(30))
        local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint32(14, crc, true)
        local.setUint32(18, data.length, true); local.setUint32(22, data.length, true); local.setUint16(26, name.length, true)
        parts.push(new Uint8Array(local.buffer), name, data)
        const cen = new DataView(new ArrayBuffer(46))
        cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint32(16, crc, true)
        cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true); cen.setUint16(28, name.length, true); cen.setUint32(42, offset, true)
        central.push(new Uint8Array(cen.buffer), name)
        offset += 30 + name.length + data.length
      }
      const size = central.reduce((s, p) => s + p.length, 0)
      const end = new DataView(new ArrayBuffer(22))
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true)
      end.setUint32(12, size, true); end.setUint32(16, offset, true)
      return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' })
    }

    function render() {
      $('#tools').hidden = !notes.length
      $('#count').textContent = notes.length + (notes.length === 1 ? ' note' : ' notes')
      $('#msg').textContent = notes.length ? '' : 'No notes yet.'
      const grid = $('#grid')
      grid.innerHTML = ''
      for (const n of notes) {
        const card = document.createElement('div')
        card.className = 'card'
        card.innerHTML = `<img alt="Note ${n.id}" loading="lazy"><div class="meta muted"></div><div class="actions">
          <button data-a="png">PNG</button><button data-a="jpg">JPG</button><button class="danger" data-a="del">Delete</button></div>`
        card.querySelector('img').src = n.src
        card.querySelector('.meta').textContent = new Date(n.createdAt).toLocaleString()
        card.addEventListener('click', async (e) => {
          const a = e.target.closest('button')?.dataset.a
          if (a === 'png') saveBlob(await pngBlob(n), fileName(n, 'png'))
          if (a === 'jpg') saveBlob(await jpgBlob(n), fileName(n, 'jpg'))
          if (a === 'del' && confirm('Delete this note from the wall for everyone?')) {
            try { await api('/' + n.id, { method: 'DELETE' }); notes = notes.filter((x) => x.id !== n.id); render() }
            catch (err) { $('#msg').textContent = err.message }
          }
        })
        grid.appendChild(card)
      }
    }

    async function load() {
      $('#msg').textContent = 'Loading…'
      try { notes = (await api('')).notes; render() }
      catch (err) { $('#msg').textContent = err.message; $('#grid').innerHTML = ''; $('#tools').hidden = true }
    }

    $('#zip').addEventListener('click', async (e) => {
      const btn = e.currentTarget
      btn.disabled = true; btn.textContent = 'Preparing…'
      try {
        const files = []
        for (const n of notes) files.push({ name: fileName(n, 'png'), data: new Uint8Array(await (await pngBlob(n)).arrayBuffer()) })
        saveBlob(zip(files), `love-notes-${stamp(Date.now())}.zip`)
      } finally { btn.disabled = false; btn.textContent = 'Download all as ZIP (PNG)' }
    })

    function syncAuth() {
      const user = id && id.currentUser()
      $('#auth').textContent = user ? 'Log out' : 'Log in'
      if (user) load()
      else { notes = []; $('#grid').innerHTML = ''; $('#tools').hidden = true; $('#msg').textContent = 'Log in with your site account (the same one as the CMS) to see the notes.' }
    }
    $('#auth').addEventListener('click', () => (id.currentUser() ? id.logout() : id.open('login')))
    if (id) {
      id.on('init', syncAuth)
      id.on('login', () => { id.close(); syncAuth() })
      id.on('logout', syncAuth) // the widget initialises itself on page load
    }
  </script>
</body>
</html>
