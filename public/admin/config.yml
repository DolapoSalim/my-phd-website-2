backend:
  name: git-gateway
  branch: adjusted

# Enables `npx decap-server` for local testing. Harmless once deployed.
local_backend: true

site_url: "https://dolaposalim.com"
display_url: "https://dolaposalim.com"

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: "site"
    label: "Pages (text & settings)"
    files:
      - name: "hero"
        label: "Home page"
        file: "src/content/site/hero.json"
        fields:
          - { name: "kicker", label: "Small line above your name", widget: "string", hint: "e.g. PhD Candidate, Biology | University of Pisa" }
          - { name: "tagline", label: "Line under “Hi, I’m Dolapo”", widget: "text", hint: "Use **text** for bold. A full stop is added automatically." }
          - { name: "status", label: "Status next to the green dot", widget: "string", hint: "e.g. Open to collaboration" }
          - name: "ctas"
            label: "Links"
            hint: "The link labelled “CV” is used for the CV link on the home page and the Download CV button."
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "url", widget: "string" }
              - { name: "style", widget: "hidden", default: "ghost" }
          - name: "facts"
            label: "Research page — fact table (Thesis / Supervisors / Funded by)"
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "value", widget: "string" }

      - name: "about"
        label: "Research page — intro statement"
        file: "src/content/site/about.json"
        fields:
          - { name: "copy", label: "Intro paragraph", widget: "text", hint: "Use **text** for bold." }

      - name: "research"
        label: "Research page — heading & interests"
        file: "src/content/site/research.json"
        fields:
          - { name: "heading", widget: "string" }
          - { name: "interests", label: "Research interests (shown as tags)", widget: "list" }

      - name: "expertise"
        label: "Tools & skills page"
        file: "src/content/site/expertise.json"
        fields:
          - { name: "sub", label: "Intro line", widget: "string" }
          - { name: "githubUrl", label: "“More on GitHub” link", widget: "string" }
          - name: "built"
            label: "Built & deployed (cards)"
            widget: "list"
            fields:
              - { name: "kind", label: "Kind (e.g. \"Web app\", \"Open source\", \"Models\")", widget: "string" }
              - { name: "meta", label: "Second label (e.g. \"Streamlit\", \"GitHub\")", widget: "string" }
              - { name: "title", widget: "string" }
              - { name: "desc", widget: "text" }
              - { name: "cta", label: "Button text (e.g. \"Launch\", \"In progress\")", widget: "string" }
              - { name: "url", label: "URL (leave blank if not linked)", widget: "string", required: false }
              - { name: "image", label: "Image (optional — a figure or screenshot; without one the card gets a drawn picture)", widget: "image", required: false }

      - name: "about-me"
        label: "Outside the lab — intro"
        file: "src/content/site/about-me.json"
        fields:
          - { name: "heading", widget: "string" }
          - { name: "copy", label: "Intro paragraph", widget: "text", hint: "Use **text** for bold." }

      - name: "love-notes"
        label: "My love life — notes wall intro"
        file: "src/content/site/love-notes.json"
        fields:
          - { name: "heading", widget: "string" }
          - { name: "intro", label: "Intro paragraph", widget: "text", hint: "Notes themselves are managed at /admin/notes.html." }

      - name: "cv-schools"
        label: "CV page — Schools & training"
        file: "src/content/site/cv-schools.json"
        fields:
          - name: "items"
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "year", widget: "string" }

      - name: "contact"
        label: "Contact & footer"
        file: "src/content/site/contact.json"
        fields:
          - { name: "email", label: "Email (home page links, CV page)", widget: "string" }
          - name: "elsewhere"
            label: "Profile links (home page and footer: LinkedIn, ORCID, ResearchGate, GitHub…)"
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "url", widget: "string" }
          - { name: "officeHours", label: "CV page — office hours", widget: "string" }
          - { name: "officeLocation", label: "CV page — office location", widget: "string" }
          - { name: "openTo", label: "CV page — open to", widget: "text" }
          - { name: "affiliations", label: "CV page — member of", widget: "string" }
          - { name: "footerLocation", label: "Footer — name & location", widget: "string" }
          - { name: "footerUpdated", label: "Footer — last updated line", widget: "string" }

  - name: "cv-education"
    label: "CV page — Education"
    folder: "src/content/cv-education"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = most recent, shown first)", widget: "number" }
      - { name: "dateStart", label: "Start year", widget: "string" }
      - { name: "dateEnd", label: "End year (blank = ongoing, shows as an em dash)", widget: "string", required: false }
      - { name: "title", widget: "string" }
      - { name: "org", label: "Institution", widget: "string" }
      - { name: "desc", widget: "text" }

  - name: "cv-appointments"
    label: "CV page — Appointments"
    folder: "src/content/cv-appointments"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = most recent, shown first)", widget: "number" }
      - { name: "dateStart", label: "Start year", widget: "string" }
      - { name: "dateEnd", label: "End year (blank = ongoing, shows as an em dash)", widget: "string", required: false }
      - { name: "title", widget: "string" }
      - { name: "org", label: "Organisation", widget: "string" }
      - { name: "desc", widget: "text" }

  - name: "publications"
    label: "Publications"
    folder: "src/content/publications"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = newest, shown first)", widget: "number" }
      - { name: "year", widget: "string" }
      - { name: "type", label: "Type (e.g. \"Research article\", \"Poster publication\")", widget: "string" }
      - { name: "title", widget: "string" }
      - { name: "desc", label: "Summary paragraph", widget: "text", required: false }
      - { name: "authors", widget: "text", hint: "Wrap your own name in __double underscores__ to highlight it." }
      - { name: "journal", widget: "string" }
      - { name: "journalMeta", label: "Journal meta (volume/pages, or host organisation)", widget: "string", required: false }
      - { name: "doi", label: "DOI button label (e.g. \"DOI ↗\")", widget: "string", required: false }
      - { name: "doiUrl", label: "DOI URL", widget: "string", required: false }
      - { name: "researchgateUrl", label: "ResearchGate link (optional — the publication's page on ResearchGate)", widget: "string", required: false }

  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = newest, shown first)", widget: "number" }
      - { name: "date", label: "Date (e.g. \"August 2026\")", widget: "string" }
      - { name: "title", widget: "string" }
      - { name: "body", label: "Post text", widget: "text", hint: "Use **text** for bold, _text_ for accent italic." }
      - { name: "tag", label: "Tag (e.g. \"Update\", \"Conference\", \"Release\")", widget: "string", required: false }
      - { name: "image", label: "Image (optional)", widget: "image", required: false }
      - { name: "imageAlt", label: "Image alt text (for screen readers)", widget: "string", required: false }
      - { name: "url", label: "Link URL (leave blank if not linked)", widget: "string", required: false }
      - { name: "urlLabel", label: "Link label (e.g. \"Read more\")", widget: "string", required: false }

  - name: "awards"
    label: "CV page — Awards & grants"
    folder: "src/content/awards"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = shown first)", widget: "number" }
      - { name: "title", widget: "string" }
      - { name: "desc", widget: "text" }
      - { name: "year", widget: "string" }

  - name: "skills"
    label: "Tools & skills — toolkit groups"
    folder: "src/content/skills"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order", widget: "number" }
      - { name: "title", label: "Group title", widget: "string" }
      - { name: "tags", widget: "list" }

  - name: "research-projects"
    label: "Research page — projects"
    folder: "src/content/research-projects"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = shown first)", widget: "number" }
      - { name: "years", label: "Years (e.g. \"2024 – present\")", widget: "string" }
      - { name: "title", widget: "string" }
      - { name: "role", label: "Role / context line", widget: "string" }
      - { name: "desc", widget: "text" }
      - { name: "url", label: "Link URL (optional)", widget: "string", required: false }
      - { name: "urlLabel", label: "Link label (optional)", widget: "string", required: false }

  - name: "interests"
    label: "Outside the lab — interests"
    folder: "src/content/interests"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = shown first)", widget: "number" }
      - { name: "title", widget: "string" }
      - { name: "tagline", label: "Tagline (one line under the title)", widget: "string" }
      - { name: "desc", label: "Longer description (optional)", widget: "text", required: false }
      - { name: "artwork", label: "Drawn artwork (used when no photos are added)", widget: "select", options: ["reading", "fitness", "content", "piano", "design", "gaming", "love", "growth"] }
      - name: "media"
        label: "Photos & videos (optional). The first three replace the drawn artwork on the card; clicking the card opens them all."
        widget: "list"
        required: false
        fields:
          - { name: "file", label: "Photo or video (JPG, PNG, WebP, MP4 or WebM — keep videos short, ideally under 10 MB)", widget: "file" }
          - { name: "caption", label: "Caption (optional — also read aloud to screen-reader users)", widget: "string", required: false }
          - { name: "poster", label: "Thumbnail for a video (optional image; shown on the card and before the video plays)", widget: "image", required: false }
      - { name: "url", label: "Link URL (optional — e.g. Instagram or PlayStation profile; /notes opens the notes wall)", widget: "string", required: false }
      - { name: "urlLabel", label: "Link label (e.g. \"Watch on YouTube\")", widget: "string", required: false }
