backend:
  name: git-gateway
  branch: adjusted

# Enables `npx decap-server` for local testing before Netlify Identity
# is wired up — see the "local_backend" flag docs. Harmless once deployed.
local_backend: true

media_folder: "public/assets/images"
public_folder: "/assets/images"

# Once the Netlify site exists, set site_url/display_url here to its
# https://<name>.netlify.app (or custom domain) to enable CMS previews.

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "hero"
        label: "Hero"
        file: "src/content/site/hero.json"
        fields:
          - { name: "navShortName", label: "Nav logo (short name)", widget: "string" }
          - { name: "navTagline", label: "Nav tagline (italic, next to logo)", widget: "string" }
          - { name: "email", label: "Contact email (mailto: nav button + contact section)", widget: "string" }
          - { name: "kicker", label: "Kicker line (next to the 01 index)", widget: "string" }
          - { name: "status", label: "Status line (e.g. \"Open to collaboration — 2026\")", widget: "string" }
          - { name: "nameLine1", label: "Name — line 1", widget: "string" }
          - { name: "nameLine2", label: "Name — line 2", widget: "string" }
          - { name: "tagline", label: "Tagline paragraph", widget: "text", hint: "Use **text** for bold, _text_ for accent italic." }
          - name: "facts"
            label: "Fact table (Thesis / Supervisors / Funded by, etc.)"
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "value", widget: "string" }
          - name: "ctas"
            label: "Call-to-action buttons"
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "url", widget: "string" }
              - { name: "style", widget: "select", options: ["fill", "ghost"] }

      - name: "about"
        label: "About"
        file: "src/content/site/about.json"
        fields:
          - { name: "copy", label: "Intro paragraph", widget: "text", hint: "Use **text** to highlight in full brightness against the dimmed base text." }
          - name: "stats"
            label: "Stat callouts"
            widget: "list"
            fields:
              - { name: "value", label: "Big number (e.g. \"06\")", widget: "string" }
              - { name: "label", widget: "string" }
              - { name: "desc", widget: "string" }

      - name: "marquee"
        label: "Marquee ticker"
        file: "src/content/site/marquee.json"
        fields:
          - { name: "items", label: "Keywords (scrolling ticker band)", widget: "list" }

      - name: "expertise"
        label: "Technical Expertise"
        file: "src/content/site/expertise.json"
        fields:
          - { name: "heading", widget: "string" }
          - { name: "sub", widget: "string" }
          - { name: "githubUrl", widget: "string" }
          - name: "built"
            label: "Built & deployed"
            widget: "list"
            fields:
              - { name: "kind", label: "Kind (e.g. \"Web app\", \"Open source\", \"Models\")", widget: "string" }
              - { name: "meta", label: "Right-aligned meta (e.g. \"Streamlit\", \"GitHub\")", widget: "string" }
              - { name: "title", widget: "string" }
              - { name: "desc", widget: "text" }
              - { name: "cta", label: "CTA label (e.g. \"Launch ↗\", \"In progress\")", widget: "string" }
              - { name: "url", label: "URL (leave blank if not linked)", widget: "string", required: false }

      - name: "cv-schools"
        label: "CV — Schools & training"
        file: "src/content/site/cv-schools.json"
        fields:
          - name: "items"
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "year", widget: "string" }

      - name: "contact"
        label: "Contact"
        file: "src/content/site/contact.json"
        fields:
          - { name: "email", widget: "string" }
          - { name: "officeHours", label: "Office hours", widget: "string" }
          - { name: "officeLocation", label: "Office location", widget: "string" }
          - name: "elsewhere"
            label: "Elsewhere (social/profile links)"
            widget: "list"
            fields:
              - { name: "label", widget: "string" }
              - { name: "url", widget: "string" }
          - { name: "affiliations", widget: "string" }
          - { name: "openTo", label: "Open to", widget: "text" }
          - { name: "footerLocation", label: "Footer — name & location", widget: "string" }
          - { name: "footerUpdated", label: "Footer — last updated line", widget: "string" }

  - name: "cv-education"
    label: "CV — Education"
    folder: "src/content/cv-education"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = most recent, shown first)", widget: "number" }
      - { name: "dateStart", label: "Start year", widget: "string" }
      - { name: "dateEnd", label: "End year (blank = ongoing, shows as an em dash)", widget: "string", required: false }
      - { name: "title", widget: "string" }
      - { name: "org", label: "Institution", widget: "string" }
      - { name: "desc", widget: "text" }

  - name: "cv-appointments"
    label: "CV — Appointments"
    folder: "src/content/cv-appointments"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = most recent, shown first)", widget: "number" }
      - { name: "dateStart", label: "Start year", widget: "string" }
      - { name: "dateEnd", label: "End year (blank = ongoing, shows as an em dash)", widget: "string", required: false }
      - { name: "title", widget: "string" }
      - { name: "org", label: "Organisation", widget: "string" }
      - { name: "desc", widget: "text" }

  - name: "publications"
    label: "Publications"
    folder: "src/content/publications"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = newest, shown first)", widget: "number" }
      - { name: "year", widget: "string" }
      - { name: "type", label: "Type (e.g. \"Research article\", \"Poster publication\")", widget: "string" }
      - { name: "title", widget: "string" }
      - { name: "desc", label: "Summary paragraph", widget: "text", required: false }
      - { name: "authors", widget: "text", hint: "Wrap your own name in __double underscores__ to highlight it." }
      - { name: "journal", widget: "string" }
      - { name: "journalMeta", label: "Journal meta (volume/pages, or host organisation)", widget: "string", required: false }
      - { name: "doi", label: "DOI button label (e.g. \"DOI ↗\")", widget: "string", required: false }
      - { name: "doiUrl", label: "DOI URL", widget: "string", required: false }

  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = newest, shown first)", widget: "number" }
      - { name: "date", label: "Date (e.g. \"August 2026\")", widget: "string" }
      - { name: "title", widget: "string" }
      - { name: "body", label: "Post text", widget: "text", hint: "Use **text** for bold, _text_ for accent italic." }
      - { name: "tag", label: "Tag (e.g. \"Update\", \"Conference\", \"Release\")", widget: "string", required: false }
      - { name: "image", label: "Image (optional)", widget: "image", required: false }
      - { name: "imageAlt", label: "Image alt text (for screen readers)", widget: "string", required: false }
      - { name: "url", label: "Link URL (leave blank if not linked)", widget: "string", required: false }
      - { name: "urlLabel", label: "Link label (e.g. \"Read more\")", widget: "string", required: false }

  - name: "awards"
    label: "Awards & Grants"
    folder: "src/content/awards"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order (lowest = shown first)", widget: "number" }
      - { name: "title", widget: "string" }
      - { name: "desc", widget: "text" }
      - { name: "year", widget: "string" }

  - name: "skills"
    label: "Expertise Stack"
    folder: "src/content/skills"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} — {{title}}"
    fields:
      - { name: "order", label: "Order", widget: "number" }
      - { name: "title", label: "Group title", widget: "string" }
      - { name: "tags", widget: "list" }
